# The Unicode data tables compiled into the binary: regex turns on the
# `unicode` feature of regex-syntax. Unicode-DFS-2016 is the earlier form of
# Unicode-3.0, with the same permissive terms.
[regex-syntax]
accepted = ["Unicode-DFS-2016"]
[regex-syntax.clarify]
license = "(MIT OR Apache-2.0) AND Unicode-DFS-2016"
[[regex-syntax.clarify.files]]
path = "LICENSE-MIT"
license = "MIT"
checksum = "6485b8ed310d3f0340bf1ad1f47645069ce4069dcc6bb46c7d5c6faf41de1fdb"
