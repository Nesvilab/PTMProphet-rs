# cargo-about: FragPipe-tools' build-ptmprophet-rs.yml renders about.hbs into
# THIRD-PARTY-LICENSES.txt for each release zip. cargo-about fails if a
# crate's license expression cannot be met from `accepted`, which lists only
# the licenses this dependency tree needs, in order of preference. The build
# also fails on any cargo-about warning. That is how it reports a
# clarification below whose checksum no longer matches the crate's file, and
# one whose key names no crate in the graph (misspelled or stale).
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
]
# Every release build's target (the `dir` of each matrix row in
# build-ptmprophet-rs.yml), so that one file covers both zips and every crate
# clarified below is in the graph. The build stops when the target it builds
# is missing here.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Skips crates with `publish = false`, which is ptmprophet-rs itself: its own
# license is in COPYING.LESSER and COPYING, not in THIRD-PARTY-LICENSES.txt.
private = { ignore = true }

# Used only by proc-macro2 and syn, inside derive macros at compile time; none
# of it is linked into the binary.
[unicode-ident]
accepted = ["Unicode-3.0"]

# The clarifications point cargo-about at license files it does not find or
# recognize on its own (it would write a placeholder MIT text with no copyright
# line instead), and add the licenses of C code and data that crates build into
# the binary. Each checksum is the SHA-256 of the file; `cargo about clarify`
# computes it.

[chrono.clarify]
license = "MIT OR Apache-2.0"
[[chrono.clarify.files]]
path = "LICENSE.txt"
checksum = "946c9835d8034d24404f8cfec5f4654cee5dad17e944afc3d06d742cf2882831"

[md5.clarify]
license = "MIT OR Apache-2.0"
[[md5.clarify.files]]
path = "LICENSE.md"
checksum = "c9759868ce3cef7bf419e389a0bc4408d48d0880fee20cdf640bcb027aca4bb6"

# The windows-* crates share one MIT file. windows-core, -implement,
# -interface, -result and -strings are in neither build: iana-time-zone pulls
# them in on Windows, but is itself only used on Linux, and one graph over both
# targets keeps both edges.
[windows-core.clarify]
license = "MIT"
[[windows-core.clarify.files]]
